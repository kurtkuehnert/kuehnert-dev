name: Dependabot Security Auto-Merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge security update
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Merge Dependabot security update
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request associated with this CI run."
            exit 0
          fi

          author="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "Not a Dependabot pull request; leaving for manual review."
            exit 0
          fi

          has_security_label="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq 'any(.labels[].name; . == "security")')"

          if [ "$has_security_label" != "true" ]; then
            echo "Not labelled as a security update; leaving for manual review."
            exit 0
          fi

          base="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName --jq '.baseRefName')"
          head="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')"

          if [ "$base" != "main" ] || [[ "$head" != dependabot/* ]]; then
            echo "Not a default-branch Dependabot PR; leaving for manual review."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
